name: Refresh UK TV Guide data
on:
  schedule:
    - cron: '30 5 * * *'   # daily, 05:30 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tvguide-data
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build listings JSON from Freeview-EPG
        run: |
          python3 -I tvguide/tools/build-epg.py tvguide/data
          n=$(python3 -c "import json;print(len(json.load(open('tvguide/data/scotland/channels.json'))))")
          test "$n" -gt 100 || { echo "Only $n channels - refusing to publish"; exit 1; }
      - name: Commit if changed
        run: |
          git config user.name "tvguide-bot"
          git config user.email "tvguide-bot@users.noreply.github.com"
          git add tvguide/data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "UK TV Guide: refresh listings"
          git push
